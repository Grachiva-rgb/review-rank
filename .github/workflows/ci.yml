# CI uses the same Node LTS line and committed npm lockfile as local verification.
# The controlled build removes provider credentials and blocks non-font external
# requests, so prerendering cannot spend a live API budget or contact customers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the committed lockfile
        run: npm ci

      # Moderate native-toolchain findings remain tracked separately in #15.
      # Fail on high/critical regressions without hiding the residual findings.
      - name: Audit for high and critical dependency regressions
        run: npm audit --package-lock-only --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm test

      - name: Controlled production-mode build
        run: npm run verify:build

      - name: Credential-free HTTP and cache-header smoke tests
        run: npm run verify:smoke
