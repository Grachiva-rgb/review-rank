# CI uses the same Node LTS line and committed npm lockfile as local verification.
# The controlled build removes provider credentials and blocks non-font external
# requests, so prerendering cannot spend a live API budget or contact customers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: reviewrank_rate_limit_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reviewrank_rate_limit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the committed lockfile
        run: npm ci

      # The scoped Xcode/UUID fix removes the remaining moderate chain.
      # Fail on every reported severity; do not suppress inherited findings.
      - name: Audit for dependency regressions at every severity
        run: npm audit --package-lock-only --audit-level=info

      - name: Native toolchain compatibility without a native build
        run: npm run verify:native-toolchain

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm test

      - name: Isolated shared-limiter SQL and concurrent-request tests
        run: node scripts/verify-rate-limit.cjs
        env:
          REVIEWRANK_TEST_PG_HOST: 127.0.0.1
          REVIEWRANK_TEST_PG_PORT: '5432'

      - name: Controlled production-mode build
        run: npm run verify:build

      - name: Credential-free HTTP and cache-header smoke tests
        run: npm run verify:smoke
