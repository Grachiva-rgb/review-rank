# CI uses the same Node LTS line and committed npm lockfile as local verification.
# The controlled build removes provider credentials and blocks non-font external
# requests, so prerendering cannot spend a live API budget or contact customers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the committed lockfile
        run: npm ci

      # Residual high/moderate build-toolchain findings are tracked separately.
      # This is a new critical-regression gate, not a claim of a clean audit.
      - name: Audit for critical dependency regressions
        run: npm audit --package-lock-only --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm test

      - name: Controlled production-mode build
        run: npm run verify:build
